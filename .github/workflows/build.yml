name: Build

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

defaults:
  run:
    shell: bash

jobs:
  ci:
    name: Package ${{ matrix.target }}
    runs-on: ${{ matrix.runs-on }}

    strategy:
      fail-fast: false

      matrix:
        target:
          - "Ubuntu-Noble"
          - "Ubuntu-Jammy"
          - "Debian-Bookworm"
          - "Debian-12"
          - "Fedora-41"
          - "OpenSUSE-Tumbleweed"
          - "ArchLinux"
          - "Manjaro"
          - "Windows"
          - "macOS"

        include:

          # ============================================================
          # Ubuntu 24.04 LTS - Noble
          # ============================================================

          - target: "Ubuntu-Noble"
            platform: "Linux"
            output-format: "system"
            runs-on: "ubuntu-latest"
            briefcase-run-prefix: "xvfb-run"
            briefcase-args: "--target ubuntu:noble"

          # ============================================================
          # Ubuntu 22.04 LTS - Jammy
          # ============================================================

          - target: "Ubuntu-Jammy"
            platform: "Linux"
            output-format: "system"
            runs-on: "ubuntu-latest"
            briefcase-run-prefix: "xvfb-run"
            briefcase-args: "--target ubuntu:jammy"

          # ============================================================
          # Debian Bookworm
          # ============================================================

          - target: "Debian-Bookworm"
            platform: "Linux"
            output-format: "system"
            runs-on: "ubuntu-latest"
            briefcase-run-prefix: "xvfb-run"
            briefcase-args: "--target debian:bookworm"

          # ============================================================
          # Debian 12
          # ============================================================

          - target: "Debian-12"
            platform: "Linux"
            output-format: "system"
            runs-on: "ubuntu-latest"
            briefcase-run-prefix: "xvfb-run"
            briefcase-args: "--target debian:12"

          # ============================================================
          # Fedora 41
          # ============================================================

          - target: "Fedora-41"
            platform: "Linux"
            output-format: "system"
            runs-on: "ubuntu-latest"
            briefcase-run-prefix: "xvfb-run"
            briefcase-args: "--target fedora:41"

          # ============================================================
          # openSUSE Tumbleweed
          # ============================================================

          - target: "OpenSUSE-Tumbleweed"
            platform: "Linux"
            output-format: "system"
            runs-on: "ubuntu-latest"
            briefcase-run-prefix: "xvfb-run"
            briefcase-args: "--target opensuse/tumbleweed:latest"

          # ============================================================
          # Arch Linux
          # ============================================================

          - target: "ArchLinux"
            platform: "Linux"
            output-format: "system"
            runs-on: "ubuntu-latest"
            briefcase-run-prefix: "xvfb-run"
            briefcase-args: "--target archlinux:latest"

          # ============================================================
          # Manjaro
          # ============================================================

          - target: "Manjaro"
            platform: "Linux"
            output-format: "system"
            runs-on: "ubuntu-latest"
            briefcase-run-prefix: "xvfb-run"
            briefcase-args: "--target manjarolinux/base:latest"

          # ============================================================
          # Windows
          # ============================================================

          - target: "Windows"
            platform: "Windows"
            output-format: "app"
            runs-on: "windows-latest"
            briefcase-run-prefix: ""
            briefcase-args: ""

          # ============================================================
          # macOS
          # ============================================================

          - target: "macOS"
            platform: "macOS"
            output-format: "app"
            runs-on: "macos-latest"
            briefcase-run-prefix: ""
            briefcase-args: ""

    steps:

      # ================================================================
      # Checkout
      # ================================================================

      - name: Checkout
        uses: actions/checkout@v5

      # ================================================================
      # Setup Python
      # ================================================================

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      # ================================================================
      # Install Briefcase
      # ================================================================

      - name: Install Briefcase
        run: |
          python -m pip install --upgrade pip
          python -m pip install briefcase

      # ================================================================
      # Install Linux host dependencies
      # ================================================================

      - name: Setup Linux Environment
        if: matrix.platform == 'Linux'
        run: |
          sudo apt-get update --fix-missing

          sudo apt-get install -y \
            socat \
            libcairo2-dev \
            libgirepository1.0-dev \
            gir1.2-gtk-3.0 \
            libcanberra-gtk3-module \
            build-essential \
            git \
            uuid-dev \
            libblkid-dev \
            libmount-dev \
            xvfb

      # ================================================================
      # Build
      # ================================================================

      - name: Build App
        run: |

          if [ "${{ matrix.platform }}" = "Linux" ]; then

            ${{ matrix.briefcase-run-prefix }} \
            briefcase build \
              ${{ matrix.platform }} \
              ${{ matrix.output-format }} \
              ${{ matrix.briefcase-args }}

          else

            briefcase build \
              ${{ matrix.platform }} \
              ${{ matrix.output-format }} \
              ${{ matrix.briefcase-args }}

          fi

      # ================================================================
      # Package
      # ================================================================

      - name: Package App
        run: |

          if [ "${{ matrix.target }}" = "macOS" ]; then

            briefcase package macOS app \
              --update \
              --no-input \
              --log \
              --adhoc-sign \
              -p pkg \
              ${{ matrix.briefcase-args }}

          elif [ "${{ matrix.target }}" = "Windows" ]; then

            briefcase package Windows app \
              --update \
              --no-input \
              --log \
              -p zip \
              ${{ matrix.briefcase-args }}

          else

            briefcase package \
              ${{ matrix.platform }} \
              ${{ matrix.output-format }} \
              --update \
              --no-input \
              --log \
              ${{ matrix.briefcase-args }}

          fi

      # ================================================================
      # Upload Linux / macOS
      # ================================================================

      - name: Upload App
        uses: actions/upload-artifact@v4
        with:
          name: BTCZPayOverlay-${{ matrix.target }}
          path: dist
          if-no-files-found: warn